<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact for Bình Duy</title>
  <link rel="icon" type="image/png" href="https://github.com/binhduy1402/ssh-key/blob/main/logo.png?raw=true" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <style>
    :root {
      --bg-color: #000;
      --text-color: #ffffff;
      --subtext-color: #aeefff;
      --muted-text: #dddddd;
      --card-bg: rgba(20, 20, 30, 0.8);
      --accent: #00ffff;
    }
    body.light-mode {
      --bg-color: #eaf4ff;
      --text-color: #111;
      --subtext-color: #007b83;
      --muted-text: #555;
      --card-bg: rgba(255, 255, 255, 0.85);
      --accent: #00bcd4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      transition: background 1s ease, color 0.5s ease;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, #001f3f, #000000 70%);
      background-size: 400% 400%;
      animation: galaxyFlow 20s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes galaxyFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(120deg,
        rgba(0,255,255,0.20),
        rgba(255,0,255,0.15),
        rgba(0,128,255,0.25)
      );
      background-size: 300% 300%;
      animation: aurora 15s ease-in-out infinite;
      z-index: 0;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    @keyframes aurora {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body.light-mode::before {
      background: linear-gradient(-45deg, #f1f5f9, #d8f3ff, #cce5ff, #b2ebf2);
      background-size: 400% 400%;
      animation: lightFlow 20s ease-in-out infinite;
    }
    @keyframes lightFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body.light-mode::after {
      background: linear-gradient(120deg,
        rgba(0,188,212,0.20),
        rgba(255,105,180,0.15),
        rgba(0,150,255,0.25)
      );
      mix-blend-mode: overlay;
    }

    #particles-js {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .welcome-box {
      background: var(--card-bg);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 0 25px var(--accent);
      text-align: center;
      margin-top: 80px;
      z-index: 2;
      width: 90%;
      max-width: 600px;
      backdrop-filter: blur(10px);
      transition: all 0.6s ease;
    }

    h1 {
      font-size: 2.5rem;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent);
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 5px var(--accent); }
      to { text-shadow: 0 0 20px var(--accent), 0 0 30px var(--accent); }
    }

    #greeting { font-size: 1.2rem; color: var(--subtext-color); font-weight: 600; text-shadow: 0 0 6px var(--accent); }
    #clock { font-family: 'Quicksand', sans-serif; font-size: 1rem; color: var(--muted-text); }
    #intro { margin-top: 20px; font-size: 1.05rem; line-height: 1.6; color: var(--text-color); }

    .social-icons {
      display: flex; justify-content: center; gap: 20px; margin-top: 20px;
    }
    .social-icons a img {
      width: 36px; height: 36px;
      background: #fff; border-radius: 50%; padding: 4px;
      filter: drop-shadow(0 0 5px var(--accent));
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .social-icons a:hover img {
      transform: scale(1.2);
      box-shadow: 0 0 15px var(--accent);
    }

    #music-toggle, #mode-toggle {
      position: fixed; width: 60px; height: 60px;
      border-radius: 50%; border: 2px solid var(--accent);
      background: var(--card-bg);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 10px var(--accent);
      cursor: pointer; transition: 0.4s; z-index: 1000;
      backdrop-filter: blur(6px);
    }
    #music-toggle:hover, #mode-toggle:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px var(--accent), 0 0 25px var(--accent);
    }
    #music-toggle { bottom: 20px; right: 20px; }
    #mode-toggle  { bottom: 20px; left: 20px;  }
    #music-toggle img, #mode-toggle img { width: 28px; height: 28px; filter: invert(1); }

    #music-toggle.playing {
      background: var(--accent);
      box-shadow: 0 0 25px var(--accent), 0 0 40px var(--accent);
      animation: rotate 5s linear infinite;
    }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    body.light-mode #music-toggle { background: rgba(0,0,0,0.05); box-shadow: 0 0 8px var(--accent); }
    body.light-mode #music-toggle img { filter: invert(0); }
    body.light-mode #music-toggle.playing { background: var(--accent); box-shadow: 0 0 15px var(--accent); }
    body.light-mode #music-toggle.playing img { filter: invert(1); }

    #scroll-hint{
      margin-top: 20px; font-size: 1.1rem; font-weight: bold;
      background: linear-gradient(to right, #00ffff, #ff00ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: glow 1.5s ease-in-out infinite alternate;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>
  <audio id="bgm" loop preload="auto"></audio>

  <div class="welcome-box">
    <h1>✨ Contact for Duy !</h1>
    <div id="greeting">Đang tính giờ...</div>
    <div id="clock">🕒 --:--:--</div>
    <div id="intro"></div>
    <div class="social-icons">
      <a href="https://www.facebook.com/binhduy.nguyenpham.92" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg"></a>
      <a href="https://www.instagram.com/_npbduy.14/" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"></a>
      <a href="https://zalo.me/0355563406" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons@14.12.3/icons/zalo.svg"></a>
      <a href="https://t.me/binhduy1402" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/telegram.svg"></a>
      <a href="https://discord.com/users/897041921665564682" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg"></a>
      <a href="https://www.linkedin.com/in/nguy%E1%BB%85n-ph%E1%BA%A1m-b%C3%ACnh-duy-ba647b372" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg"></a>
      <a href="mailto:binhduy140203@gmail.com" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg"></a>
    </div>
    <div id="scroll-hint"></div>
  </div>

  <div id="music-toggle" title="Bật/tắt nhạc">
    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons@14.12.3/icons/applemusic.svg" alt="Music" />
  </div>
  <div id="mode-toggle" title="Chuyển sáng/tối">
    <img id="mode-icon" src="https://cdn-icons-png.flaticon.com/512/169/169367.png" alt="Mode">
  </div>

  <script>
    /* ========== PARTICLES THEME SYNC ========== */
    function initParticles(isLightMode = false) {
      if (window.pJSDom && window.pJSDom.length > 0) {
        window.pJSDom[0].pJS.fn.vendors.destroypJS();
        window.pJSDom = [];
      }

      particlesJS("particles-js", {
        particles: {
          number: { value: 60 },
          size: { value: 2 },
          color: { value: isLightMode ? "#00bcd4" : "#ffd700" },
          line_linked: {
            enable: true,
            distance: 100,
            color: isLightMode ? "#00bcd4" : "#ffd700",
            opacity: 0.4,
            width: 1
          },
          move: { enable: true, speed: 2 }
        },
        interactivity: {
          detect_on: "canvas",
          events: {
            onhover: { enable: true, mode: "repulse" },
            onclick: { enable: true, mode: "push" }
          }
        }
      });
    }
    initParticles(false);

    /* ========== CHUYỂN MODE ========== */
    const modeToggle = document.getElementById("mode-toggle");
    const modeIcon = document.getElementById("mode-icon");
    modeToggle.addEventListener("click", () => {
      document.body.classList.toggle("light-mode");
      const isLight = document.body.classList.contains("light-mode");
      modeIcon.src = isLight
        ? "https://cdn-icons-png.flaticon.com/512/169/169367.png"
        : "https://cdn-icons-png.flaticon.com/512/869/869869.png";
      initParticles(isLight);
    });
  </script>
</body>
</html>
