<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact for Bình Duy</title>
  <link rel="icon" type="image/png" href="https://github.com/binhduy1402/ssh-key/blob/main/logo.png?raw=true" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <style>
    :root {
      --bg-color: #000;
      --text-color: #ffffff;
      --subtext-color: #aeefff;
      --muted-text: #dddddd;
      --card-bg: rgba(20, 20, 30, 0.8);
      --accent: #00ffff;
    }
    body.light-mode {
      --bg-color: #eaf4ff;
      --text-color: #111;
      --subtext-color: #007b83;
      --muted-text: #555;
      --card-bg: rgba(255, 255, 255, 0.85);
      --accent: #00bcd4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      transition: background 1s ease, color 0.5s ease;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, #001f3f, #000000 70%);
      background-size: 400% 400%;
      animation: galaxyFlow 20s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes galaxyFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(120deg,
        rgba(0,255,255,0.20),
        rgba(255,0,255,0.15),
        rgba(0,128,255,0.25)
      );
      background-size: 300% 300%;
      animation: aurora 15s ease-in-out infinite;
      z-index: 0;
      mix-blend-mode: screen;
      pointer-events: none;
    }
    @keyframes aurora {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

  body.light-mode::before {
      background: linear-gradient(
        -45deg,
        #f1f5f9,
        #d8f3ff,
        #cce5ff,
        #b2ebf2
      );
      background-size: 400% 400%;
      animation: lightFlow 20s ease-in-out infinite;
    }
    
    @keyframes lightFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    body.light-mode::after {
      background: linear-gradient(120deg,
        rgba(0,188,212,0.20),
        rgba(255,105,180,0.15),
        rgba(0,150,255,0.25)
      );
      mix-blend-mode: overlay;
    }

    #particles-js {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .welcome-box {
      background: var(--card-bg);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 0 25px var(--accent);
      text-align: center;
      margin-top: 80px;
      z-index: 2;
      width: 90%;
      max-width: 600px;
      backdrop-filter: blur(10px);
      transition: all 0.6s ease;
    }
    h1 {
      font-size: 2.5rem;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent);
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 5px var(--accent); }
      to { text-shadow: 0 0 20px var(--accent), 0 0 30px var(--accent); }
    }
    #greeting {
      font-size: 1.2rem;
      color: var(--subtext-color);
      font-weight: 600;
      text-shadow: 0 0 6px var(--accent);
      transition: color 0.5s ease;
    }
    #clock {
      font-family: 'Quicksand', sans-serif;
      font-size: 1rem;
      color: var(--muted-text);
    }
    #intro {
      margin-top: 20px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-color);
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .social-icons a img {
      width: 36px; height: 36px;
      background: #fff;
      border-radius: 50%;
      padding: 4px;
      filter: drop-shadow(0 0 5px var(--accent));
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .social-icons a:hover img {
      transform: scale(1.2);
      box-shadow: 0 0 15px var(--accent);
    }

    #music-toggle, #mode-toggle {
      position: fixed;
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: var(--card-bg);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 10px var(--accent);
      cursor: pointer;
      transition: 0.4s;
      z-index: 1000;
      backdrop-filter: blur(6px);
    }
    #music-toggle:hover, #mode-toggle:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px var(--accent), 0 0 25px var(--accent);
    }
    #music-toggle { bottom: 20px; right: 20px; }
    #mode-toggle  { bottom: 20px; left: 20px;  }
    #music-toggle img, #mode-toggle img { width: 28px; height: 28px; filter: invert(1); }

    #music-toggle.playing {
      background: var(--accent);
      box-shadow: 0 0 25px var(--accent), 0 0 40px var(--accent);
      animation: rotate 5s linear infinite;
    }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    body.light-mode #music-toggle { background: rgba(0,0,0,0.05); box-shadow: 0 0 8px var(--accent); }
    body.light-mode #music-toggle img { filter: invert(0); }
    body.light-mode #music-toggle.playing { background: var(--accent); box-shadow: 0 0 15px var(--accent); }
    body.light-mode #music-toggle.playing img { filter: invert(1); }

    #gift-section {
      margin: 100px auto;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      transition: all 1s ease;
      width: 90%;
      max-width: 400px;
      z-index: 2;
    }
    #gift-section.visible { opacity: 1; transform: translateY(0); }
    .gift-caption { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; color: var(--text-color); }
    .gift-wrapper { width: 140px; height: 140px; margin: 0 auto; cursor: pointer; position: relative; }
    .gift-box {
      width: 100%; height: 100%;
      background: url('https://raw.githubusercontent.com/binhduy1402/ssh-key/main/gift.png') center/contain no-repeat;
      animation: shake 2s infinite;
    }
    @keyframes shake {
      0%,100%{transform:rotate(0deg);}
      25%{transform:rotate(2deg);}
      50%{transform:rotate(-2deg);}
      75%{transform:rotate(2deg);}
    }
    #reward {
      margin-top: 20px;
      font-size: 1.2rem;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.5s;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 20px;
      box-shadow: 0 0 10px var(--accent);
      text-align: center;
      color: var(--text-color);
    }
    #reward.show { opacity: 1; transform: scale(1); }
    #message-box { color: #ff7070; font-size: 1rem; margin-top: 15px; font-weight: 600; opacity: 0; transition: opacity 0.5s; }
    #message-box.show { opacity: 1; }

    #scroll-hint{
      margin-top: 20px;
      font-size: 1.1rem;
      font-weight: bold;
      background: linear-gradient(to right, #00ffff, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 1.5s ease-in-out infinite alternate;
      white-space: pre-wrap;
    }
    #chat-toggle{
  position: fixed;
  bottom: 95px;
  right: 20px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  background: var(--card-bg);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:1001;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 15px var(--accent);
  transition:.3s;
}

#chat-toggle:hover{
  transform: scale(1.1);
}

#chat-toggle span{
  font-size:28px;
}

#chat-container{
  position: fixed;
  bottom: 170px;
  right: 20px;
  width: 360px;
  height: 520px;
  background: rgba(10,10,25,.95);
  border: 2px solid var(--accent);
  border-radius: 20px;
  box-shadow:
      0 0 20px var(--accent),
      0 0 40px rgba(0,255,255,.3);
  display:none;
  flex-direction:column;
  overflow:hidden;
  z-index:1002;
  backdrop-filter: blur(10px);
}

#chat-container.show{
  display:flex;
}

.chat-header{
  padding:15px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,.1);
  color:var(--accent);
  font-weight:bold;
  font-size:18px;
}

#chat-messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.msg{
  max-width:80%;
  padding:10px 14px;
  border-radius:14px;
  word-wrap:break-word;
}

.user-msg{
  align-self:flex-end;
  background:var(--accent);
  color:#000;
}

.bot-msg{
  align-self:flex-start;
  background:rgba(255,255,255,.1);
  color:#fff;
}

.chat-input{
  display:flex;
  padding:10px;
  gap:10px;
  border-top:1px solid rgba(255,255,255,.1);
}

.chat-input input{
  flex:1;
  border:none;
  outline:none;
  border-radius:10px;
  padding:10px;
  background:rgba(255,255,255,.08);
  color:white;
}

.chat-input button{
  border:none;
  cursor:pointer;
  padding:10px 15px;
  border-radius:10px;
  background:var(--accent);
  color:black;
  font-weight:bold;
}

.typing{
  color:#aaa;
  font-style:italic;
}

@media(max-width:768px){

  #chat-container{
      width:95%;
      height:70vh;
      right:2.5%;
      bottom:90px;
  }
}

    #chat-close{
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 20px;
    cursor: pointer;
    transition: .3s;
}

#chat-close:hover{
    transform: scale(1.2);
    color: #ff4d4d;
}

.chat-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px;
}
  </style>
</head>
<body>
  <div id="particles-js"></div>
  <audio id="bgm" loop preload="auto"></audio>

  <div class="welcome-box">
    <h1>✨ Contact for Duy !</h1>
    <div id="greeting">Đang tính giờ...</div>
    <div id="clock">🕒 --:--:--</div>
    <div id="intro"></div>
    <div class="social-icons">
      <a href="https://www.facebook.com/binhduy.nguyenpham.92" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg"></a>
      <a href="https://www.instagram.com/_npbduy.14/" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"></a>
      <a href="https://zalo.me/0355563406" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons@14.12.3/icons/zalo.svg"></a>
      <a href="https://t.me/binhduy1402" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/telegram.svg"></a>
      <a href="https://discord.com/users/897041921665564682" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg"></a>
      <a href="https://www.linkedin.com/in/duy-nguyen-pham-binh-ba647b372/" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg"></a>
      <a href="mailto:duynguyen03.work@gmail.com" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg"></a>
    </div>
    <div id="scroll-hint"></div>
  </div>

  <div id="gift-section">
    <div class="gift-caption">Có món quà nhỏ cho bạn nè! Mở ra đi 😁</div>
    <div class="gift-wrapper" id="gift-wrapper"><div class="gift-box"></div></div>
    <div id="reward"></div>
    <div id="message-box"></div>
  </div>

  <div id="music-toggle" title="Bật/tắt nhạc">
    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons@14.12.3/icons/applemusic.svg" alt="Music" />
  </div>
  <div id="mode-toggle" title="Chuyển sáng/tối">
    <img id="mode-icon" src="https://cdn-icons-png.flaticon.com/512/169/169367.png" alt="Mode">
  </div>

  <div id="chat-toggle">
  <span>🤖</span>
</div>

<div id="chat-container">

  <div class="chat-header">
    <span>Duy AI Assistant</span>

    <button id="chat-close">
        ✕
    </button>
</div>

  <div id="chat-messages">
      <div class="msg bot-msg">
          Xin chào 👋 Tôi có thể giúp gì cho bạn?
      </div>
  </div>

  <div class="chat-input">
      <input
          type="text"
          id="chat-input"
          placeholder="Nhập tin nhắn..."
      />
      <button id="send-btn">Gửi</button>
  </div>

</div>

  <script>
    window.onload = function() {
      const audio = document.getElementById("bgm");
      const musicFiles = [
        "music/music1.mp3", "music/music2.mp3", "music/music3.mp3",
        "music/music4.mp3", "music/music5.mp3", "music/music6.mp3"
      ];
      const toggleBtn = document.getElementById("music-toggle");

      function chooseRandomMusic() {
        const randomIndex = Math.floor(Math.random() * musicFiles.length);
        audio.src = musicFiles[randomIndex];
        audio.load();
      }
      chooseRandomMusic();

      toggleBtn.addEventListener("click", () => {
        if (audio.paused) {
          audio.play();
          toggleBtn.classList.add("playing");
        } else {
          audio.pause();
          toggleBtn.classList.remove("playing");
        }
      });

      document.body.addEventListener("click", function initPlay() {
        audio.play().then(() => { toggleBtn.classList.add("playing"); }).catch(() => {});
        document.body.removeEventListener("click", initPlay);
      });
    };

    const modeToggle = document.getElementById("mode-toggle");
    const modeIcon = document.getElementById("mode-icon");
    modeToggle.addEventListener("click", () => {
      document.body.classList.toggle("light-mode");
      const isLight = document.body.classList.contains("light-mode");
      modeIcon.src = isLight
        ? "https://cdn-icons-png.flaticon.com/512/169/169367.png" // moon
        : "https://cdn-icons-png.flaticon.com/512/869/869869.png"; // sun
    });

    function updateClockAndGreeting() {
      const now = new Date();
      const hours = now.getHours();
      const timeString = now.toLocaleTimeString('vi-VN');
      document.getElementById("clock").textContent = "🕒 " + timeString;

      let greeting = "Chào bạn!";
      if (hours >= 5 && hours < 11) greeting = "Buổi sáng tràn đầy năng lượng nhá ! ☀️";
      else if (hours >= 11 && hours < 17) greeting = "Buổi chiều vui vẻ nha! 🌤";
      else if (hours >= 17 && hours < 22) greeting = "Buổi tối ấm áp nè! 🌙";
      else greeting = "Đi ngủ đi nha khuya rùi đó ! 😴";
      document.getElementById("greeting").textContent = greeting;
    }
    setInterval(updateClockAndGreeting, 1000);
    updateClockAndGreeting();

    const introText = [
      "Hello, Bình Duy đây !",
      "Bạn có thể tìm thấy tui ở đây nè ⬇️"
    ];
    const introDiv = document.getElementById("intro");
    let line = 0, char = 0;
    function typeLine() {
      if (line < introText.length) {
        if (char < introText[line].length) {
          introDiv.innerHTML += introText[line].charAt(char);
          char++; setTimeout(typeLine, 40);
        } else {
          introDiv.innerHTML += "<br/>"; line++; char = 0; setTimeout(typeLine, 400);
        }
      }
    }
    typeLine();

    const scrollHintText = "Khoan kéo xuống đi, còn điều bất ngờ cho bạn đó !!!";
    const scrollHintDiv = document.getElementById("scroll-hint");
    let scrollChar = 0;
    function typeScrollHint() {
      if (scrollChar < scrollHintText.length) {
        scrollHintDiv.innerHTML += scrollHintText.charAt(scrollChar);
        scrollChar++; setTimeout(typeScrollHint, 50);
      }
    }
    const totalTypingTime = introText.reduce((sum, line) => sum + line.length * 40 + 400, 0);
    setTimeout(typeScrollHint, totalTypingTime);
    
    const giftWrapper = document.getElementById("gift-wrapper");
    const rewardDiv = document.getElementById("reward");
    const messageBox = document.getElementById("message-box");
    const rewards = [
      "Tặng bạn 1 trái tym to bự nè ❤️",
      "Tặng bạn con chim nè 🐦",
      "Tặng tui cho bạn nè 🫶",
      "Tặng bạn 1 cái ôm nè 🤗"
    ];
    let giftOpened = false;

    giftWrapper.addEventListener("click", () => {
      if (!giftOpened) {
        const reward = rewards[Math.floor(Math.random() * rewards.length)];
        rewardDiv.textContent = reward;
        rewardDiv.classList.add("show");
        messageBox.textContent = "";
        messageBox.classList.remove("show");
        giftOpened = true;
      } else {
        messageBox.textContent = "Một món quà thôi hong có được tham lam nhe !!! 😜";
        messageBox.classList.add("show");
      }
    });

    window.addEventListener("scroll", () => {
      const gift = document.getElementById("gift-section");
      const rect = gift.getBoundingClientRect();
      if (rect.top < window.innerHeight - 100) gift.classList.add("visible");
    });

    particlesJS("particles-js", {
      particles: {
        number: { value: 60 },
        size: { value: 2 },
        color: { value: "#ff006f" },
        line_linked: { enable: true, distance: 100, color: "#ff006f", opacity: 1.0, width: 1.5 },
        move: { enable: true, speed: 2 }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" }
        }
      }
    });

    const chatToggle =
document.getElementById("chat-toggle");

const chatContainer =
document.getElementById("chat-container");

const chatClose =
document.getElementById("chat-close");

const chatMessages =
document.getElementById("chat-messages");

const chatInput =
document.getElementById("chat-input");

const sendBtn =
document.getElementById("send-btn");

chatToggle.addEventListener("click", () => {
    chatContainer.classList.toggle("show");
});

chatClose.addEventListener("click", () => {
    chatContainer.classList.remove("show");
});


function addMessage(text, type){

    const msg =
    document.createElement("div");

    msg.className =
    `msg ${type}-msg`;

    msg.textContent =
    text;

    chatMessages.appendChild(msg);

    chatMessages.scrollTop =
    chatMessages.scrollHeight;
}

/* chatbot demo */

function botReply(message){

    const text =
    message.toLowerCase();

    if(text.includes("hello") || text.includes("hi")){
        return "Xin chào 👋";
    }

    if(text.includes("facebook")){
        return "Facebook nằm ở phía trên nha 😁";
    }

    if(text.includes("zalo")){
        return "Zalo của Duy: 0355563406";
    }

    if(text.includes("discord")){
        return "Discord cũng có trên trang luôn nhé 😎";
    }

    return "Mình chưa có AI đâu 😅 Duy đang xây dựng chatbot.";
}

function sendMessage(){

    const message =
    chatInput.value.trim();

    if(!message) return;

    addMessage(message, "user");

    chatInput.value = "";

    setTimeout(() => {

        addMessage(
            botReply(message),
            "bot"
        );

    }, 500);
}

sendBtn.addEventListener(
    "click",
    sendMessage
);

chatInput.addEventListener(
    "keydown",
    (e)=>{
        if(e.key==="Enter"){
            sendMessage();
        }
    }
);
    
  </script>
</body>
</html>
